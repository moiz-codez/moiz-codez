name: refresh language stats

on:
  schedule:
    - cron: "42 5 * * *"   # once a day
  workflow_dispatch:        # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-language-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh lang-stats.svg
        run: python3 scripts/make_lang_stats.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain -- lang-stats.svg)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lang-stats.svg
          git commit -m "chore: refresh language stats"
          git push
