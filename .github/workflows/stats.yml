name: refresh system info

# No push trigger on its own commits: this job commits neofetch.svg, and a
# push trigger would make it re-run on that commit forever.
on:
  schedule:
    - cron: "17 5 * * *"   # once a day
  workflow_dispatch:        # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-system-info
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only -- nothing to install.
      - name: Refresh neofetch.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_neofetch.py

      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain -- neofetch.svg)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- neofetch.svg
          git commit -m "chore: refresh system info"
          git push
