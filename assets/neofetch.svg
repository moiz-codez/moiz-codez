<text x="18" y="130">            ||   ||</text>
<text x="18" y="145">            |'---'|</text>
<text x="18" y="160">            \     /</text>
<text x="18" y="175">             '---'</text>
<!-- Terminal prompt -->
<text x="18" y="220" class="cursor" font-size="18">$ _</text>
