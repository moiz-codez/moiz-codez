<svg xmlns="http://www.w3.org/2000/svg" width="660" height="580" viewBox="0 0 660 580" font-family="JBMono,ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<style>
  .bg{fill:#ffffff}@media(prefers-color-scheme:dark){.bg{fill:#0d1117}}
  .a{fill:#6e7681}@media(prefers-color-scheme:dark){.a{fill:#c9d1d9}}
  .b{fill:#424a53}@media(prefers-color-scheme:dark){.b{fill:#f0f6fc}}
  .c{fill:#8c959f}@media(prefers-color-scheme:dark){.c{fill:#8b949e}}
  .accent{fill:#d29922}@media(prefers-color-scheme:dark){.accent{fill:#d29922}}
  .key{fill:#a04100}@media(prefers-color-scheme:dark){.key{fill:#ffa657}}
  .val{fill:#0550ae}@media(prefers-color-scheme:dark){.val{fill:#a5d6ff}}
  .dim{fill:#afb8c1}@media(prefers-color-scheme:dark){.dim{fill:#484f58}}
  .rule{stroke:#d8dee4}@media(prefers-color-scheme:dark){.rule{stroke:#30363d}}
  @media(prefers-reduced-motion){animate{display:none}set{display:none}}
  .pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .cursor{animation:blink 1s step-end infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
<rect width="660" height="580" rx="12" class="bg"/>

<!-- Terminal ASCII art - left side -->
